<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F2653A" />
  <title>文字转文档 · Sunshine个人工作站</title>
  <meta name="description" content="输入或粘贴文字，排版生成 A4 的 Word 或 PDF 文档，支持保存到本地与系统分享。" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <!-- 复用图片转文档的视觉 token 与通用组件，仅叠加文字编辑/预览所需样式 -->
  <link rel="stylesheet" href="css/image-to-doc.css?v=20261122e" />
  <link rel="stylesheet" href="css/text-to-doc.css?v=20261122e" />
</head>
<body>
  <!-- 图标精灵 -->
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3zM19 16l.7 1.8L21.5 18l-1.8.7L19 20.5l-.7-1.8L16.5 18l1.8-.2L19 16z"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="i-clipboard" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 12h6M9 16h6"/></symbol>
  </svg>

  <div class="page">
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="topbar__inner">
        <button class="icon-btn" id="btn-back" aria-label="返回首页" title="返回首页">
          <svg class="icon"><use href="#i-arrow-left"/></svg>
        </button>
        <span class="brand-mark"><svg class="icon"><use href="#i-edit"/></svg></span>
        <div class="topbar__title">
          <strong>文字转文档</strong>
          <small>输入或粘贴文字生成 Word / PDF</small>
        </div>
        <button class="icon-btn theme-btn" style="margin-left:auto" data-action="toggle-theme" aria-label="切换到黑暗模式" title="切换到黑暗模式" aria-pressed="false">
          <svg class="icon"><use href="#i-sun"/></svg>
        </button>
      </div>
    </header>

    <main class="container" id="main">
      <!-- 步骤 1：输入文字 -->
      <section class="card" aria-labelledby="step1-title">
        <div class="card__head">
          <span class="step-no">1</span>
          <div>
            <h2 class="card__title" id="step1-title">输入文字</h2>
            <p class="card__sub">可直接输入，或从其他地方复制粘贴；换行会成为文档中的新段落</p>
          </div>
        </div>

        <div class="editor-wrap">
          <textarea id="text-input" class="editor" rows="10" placeholder="在这里输入或粘贴文字…&#10;&#10;例如：&#10;Sunshine个人工作站学习心得&#10;今天我学习了新的知识，收获很大。"></textarea>
          <div class="editor__bar">
            <span class="editor__count" id="char-count">0 字 · 1 段</span>
            <span class="editor__tools">
              <button type="button" class="link-btn" id="btn-paste">粘贴剪贴板</button>
              <button type="button" class="link-btn" id="btn-sample">填入示例</button>
              <button type="button" class="link-btn link-btn--danger" id="btn-clear">清空</button>
            </span>
          </div>
        </div>
      </section>

      <!-- 步骤 2：排版设置 -->
      <section class="card" aria-labelledby="step2-title">
        <div class="card__head">
          <span class="step-no">2</span>
          <div>
            <h2 class="card__title" id="step2-title">排版设置</h2>
            <p class="card__sub">所选效果会实时显示在右侧预览中</p>
          </div>
        </div>

        <div class="config">
          <div class="config__fields">
            <div class="field">
              <label class="field__label" id="label-format">文档格式</label>
              <div class="seg" role="radiogroup" aria-labelledby="label-format">
                <button type="button" class="seg__btn is-active" data-group="format" data-value="word" role="radio" aria-checked="true">Word (.docx)</button>
                <button type="button" class="seg__btn" data-group="format" data-value="pdf" role="radio" aria-checked="false">PDF (.pdf)</button>
              </div>
            </div>

            <div class="field">
              <label class="field__label" id="label-orientation">页面方向</label>
              <div class="seg" role="radiogroup" aria-labelledby="label-orientation">
                <button type="button" class="seg__btn is-active" data-group="orientation" data-value="portrait" role="radio" aria-checked="true">竖版</button>
                <button type="button" class="seg__btn" data-group="orientation" data-value="landscape" role="radio" aria-checked="false">横版</button>
              </div>
            </div>

            <div class="field">
              <label class="field__label" id="label-fontSize">正文字号</label>
              <div class="seg" role="radiogroup" aria-labelledby="label-fontSize">
                <button type="button" class="seg__btn" data-group="fontSize" data-value="12" role="radio" aria-checked="false">小四</button>
                <button type="button" class="seg__btn is-active" data-group="fontSize" data-value="14" role="radio" aria-checked="true">四号</button>
                <button type="button" class="seg__btn" data-group="fontSize" data-value="16" role="radio" aria-checked="false">三号</button>
                <button type="button" class="seg__btn" data-group="fontSize" data-value="18" role="radio" aria-checked="false">二号</button>
              </div>
            </div>

            <div class="field">
              <label class="field__label" id="label-lineSpacing">行距</label>
              <div class="seg" role="radiogroup" aria-labelledby="label-lineSpacing">
                <button type="button" class="seg__btn is-active" data-group="lineSpacing" data-value="1.5" role="radio" aria-checked="true">1.5 倍</button>
                <button type="button" class="seg__btn" data-group="lineSpacing" data-value="1" role="radio" aria-checked="false">单倍</button>
                <button type="button" class="seg__btn" data-group="lineSpacing" data-value="2" role="radio" aria-checked="false">2 倍</button>
              </div>
            </div>

            <div class="field field--row">
              <div class="field__inline">
                <label class="field__label" for="margin-input">页边距 (mm)</label>
                <input type="number" id="margin-input" class="input" value="20" min="0" max="40" step="1" inputmode="numeric" />
              </div>
              <div class="field__inline field__inline--grow">
                <label class="field__label" for="name-input">文档名称</label>
                <input type="text" id="name-input" class="input" value="文字文档" maxlength="60" placeholder="无需输入扩展名" />
              </div>
            </div>
            <p class="field__note">文字仅在本机浏览器内排版，不会上传到服务器；中文、英文与标点均支持。</p>
          </div>

          <div class="config__preview">
            <p class="preview__title">页面效果预览</p>
            <div class="preview__stage">
              <div class="paper paper--portrait" id="paper">
                <div class="paper__area" id="paper-area">
                  <p class="paper__doc-title" id="paper-title">文字文档</p>
                  <div class="paper__text" id="paper-text"></div>
                </div>
              </div>
            </div>
            <p class="preview__caption" id="preview-caption">A4 竖版 · 四号 · 1.5 倍行距 · 边距 20mm</p>
          </div>
        </div>
      </section>

      <!-- 步骤 3：生成与保存 -->
      <section class="card card--action" aria-labelledby="step3-title">
        <div class="card__head">
          <span class="step-no">3</span>
          <div>
            <h2 class="card__title" id="step3-title">生成并保存</h2>
            <p class="card__sub">与图片转文档一致：可保存到本地，也支持系统分享</p>
          </div>
        </div>

        <div class="action-row">
          <button type="button" class="btn btn--primary btn--lg" id="btn-generate">
            <svg class="icon"><use href="#i-sparkles"/></svg><span>生成文档</span>
          </button>
          <button type="button" class="btn btn--ghost btn--lg" id="btn-reset">
            <svg class="icon"><use href="#i-refresh"/></svg><span>恢复默认</span>
          </button>
        </div>

        <div class="progress-wrap" id="progress-wrap" hidden>
          <div class="progress"><div class="progress__bar" id="progress-bar"></div></div>
          <p class="progress__text" id="progress-text">正在准备…</p>
        </div>

        <div class="result" id="result" hidden aria-live="polite">
          <div class="result__icon"><svg class="icon"><use href="#i-check"/></svg></div>
          <div class="result__body">
            <strong id="result-name">文字文档.docx</strong>
            <small id="result-meta">生成完成</small>
          </div>
        </div>
        <div class="save-row" id="save-row" hidden>
          <button type="button" class="btn btn--primary" id="btn-save"><svg class="icon"><use href="#i-download"/></svg>保存到本地</button>
          <button type="button" class="btn btn--outline" id="btn-share"><svg class="icon"><use href="#i-share"/></svg>系统分享</button>
        </div>

        <div class="notice" id="notice" hidden>
          <svg class="icon"><use href="#i-info"/></svg><span id="notice-text"></span>
        </div>
      </section>

      <footer class="footer">Sunshine个人工作站 · 文字转文档工具 · 所有处理均在本机完成</footer>
    </main>
  </div>

  <!-- 全局反馈：Toast / 加载遮罩 -->
  <div class="toast-root" id="toast-root" aria-live="polite"></div>
  <div class="overlay" id="overlay" hidden>
    <div class="overlay__box">
      <div class="spinner" aria-hidden="true"></div>
      <p id="overlay-text">正在生成，请稍候…</p>
    </div>
  </div>

  <!-- 浏览器端文档生成库（本地优先，离线可用，与图片转文档共用） -->
  <script src="vendor/docx.umd.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="js/tool-common.js?v=20261122e"></script>
  <script src="js/text-to-doc.js?v=20261122e"></script>
</body>
</html>
